<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>two-dinners</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #0c0d10;
        color: #cfd2d8;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      h1 { font-size: 14px; font-weight: 500; margin: 0; opacity: 0.7; }
      canvas {
        background: #16181d;
        border: 1px solid #2a2d33;
        image-rendering: pixelated;
      }
      #hud { font-size: 12px; opacity: 0.55; }
    </style>
  </head>
  <body>
    <h1>two-dinners — WASD/arrows to move, left-click to cast. open a second tab for co-op.</h1>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
